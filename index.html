<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MikeTech</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            text-align: center;
        }

        header {
            padding: 25px;
            background: #020617;
        }

        header h1 {
            color: #38bdf8;
            font-size: 35px;
        }

        main {
            padding: 100px 20px;
        }

        main h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        main p {
            color: #cbd5e1;
            font-size: 18px;
            margin-bottom: 30px;
        }

        button {
            background: #38bdf8;
            color: #020617;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        footer {
            padding: 25px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <header>
        <h1>MikeTech</h1>
        <p>Technology | Creativity | Innovation</p>
    </header>

    <main>
        <h2>Welcome to MikeTech!</h2>

        <p>
            My journey into Computer Science starts here.
            Explore technology with me.
        </p>

        <button onclick="alert('Welcome to MikeTech!')">
            Explore More
        </button>
    </main>

    <footer>
        <p>© 2026 MikeTech. All rights reserved.</p>
    </footer>
</body>
</html>
